<svg xmlns="http://www.w3.org/2000/svg" width="860" height="96" viewBox="0 0 860 96">
<style>
  .q { font: 18px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #8b5cf6; }
  .a { font: italic 14px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #d4a017; }
  .cur { fill: #8b5cf6; animation: blink 0.9s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
</style>
<rect width="0" height="0"><animate id="cycle" attributeName="x" from="0" to="1" dur="28s" begin="0s;cycle.end"/></rect>
<clipPath id="c0"><rect x="44.6" y="10" height="40" width="0">
  <animate attributeName="width" from="0" to="770.8" dur="2.6s" begin="cycle.begin+0s" fill="freeze"/></rect></clipPath>
<g opacity="0">
  <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.03;0.9;1" dur="7s" begin="cycle.begin+0s" fill="freeze"/>
  <text class="q" x="44.6" y="38" clip-path="url(#c0)">“Any sufficiently advanced technology is indistinguishable from magic.”</text>
  <rect class="cur" x="44.6" y="22" width="10" height="20">
    <animate attributeName="x" from="44.6" to="815.4" dur="2.6s" begin="cycle.begin+0s" fill="freeze"/></rect>
  <text class="a" x="430.0" y="74" text-anchor="middle" opacity="0">— Arthur C. Clarke
    <animate attributeName="opacity" from="0" to="1" dur="0.8s" begin="cycle.begin+2.6s" fill="freeze"/>
    <animate attributeName="opacity" to="0" dur="0.1s" begin="cycle.begin+0s" fill="freeze"/></text>
</g>
<clipPath id="c1"><rect x="131.0" y="10" height="40" width="0">
  <animate attributeName="width" from="0" to="598.0" dur="2.6s" begin="cycle.begin+7s" fill="freeze"/></rect></clipPath>
<g opacity="0">
  <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.03;0.9;1" dur="7s" begin="cycle.begin+7s" fill="freeze"/>
  <text class="q" x="131.0" y="38" clip-path="url(#c1)">“Whereof one cannot speak, thereof one must be silent.”</text>
  <rect class="cur" x="131.0" y="22" width="10" height="20">
    <animate attributeName="x" from="131.0" to="729.0" dur="2.6s" begin="cycle.begin+7s" fill="freeze"/></rect>
  <text class="a" x="430.0" y="74" text-anchor="middle" opacity="0">— Wittgenstein
    <animate attributeName="opacity" from="0" to="1" dur="0.8s" begin="cycle.begin+9.6s" fill="freeze"/>
    <animate attributeName="opacity" to="0" dur="0.1s" begin="cycle.begin+7s" fill="freeze"/></text>
</g>
<clipPath id="c2"><rect x="244.4" y="10" height="40" width="0">
  <animate attributeName="width" from="0" to="371.2" dur="2.6s" begin="cycle.begin+14s" fill="freeze"/></rect></clipPath>
<g opacity="0">
  <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.03;0.9;1" dur="7s" begin="cycle.begin+14s" fill="freeze"/>
  <text class="q" x="244.4" y="38" clip-path="url(#c2)">“One must imagine Sisyphus happy.”</text>
  <rect class="cur" x="244.4" y="22" width="10" height="20">
    <animate attributeName="x" from="244.4" to="615.6" dur="2.6s" begin="cycle.begin+14s" fill="freeze"/></rect>
  <text class="a" x="430.0" y="74" text-anchor="middle" opacity="0">— Albert Camus
    <animate attributeName="opacity" from="0" to="1" dur="0.8s" begin="cycle.begin+16.6s" fill="freeze"/>
    <animate attributeName="opacity" to="0" dur="0.1s" begin="cycle.begin+14s" fill="freeze"/></text>
</g>
<clipPath id="c3"><rect x="303.8" y="10" height="40" width="0">
  <animate attributeName="width" from="0" to="252.4" dur="2.6s" begin="cycle.begin+21s" fill="freeze"/></rect></clipPath>
<g opacity="0">
  <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.03;0.9;1" dur="7s" begin="cycle.begin+21s" fill="freeze"/>
  <text class="q" x="303.8" y="38" clip-path="url(#c3)">“Hell is other people.”</text>
  <rect class="cur" x="303.8" y="22" width="10" height="20">
    <animate attributeName="x" from="303.8" to="556.2" dur="2.6s" begin="cycle.begin+21s" fill="freeze"/></rect>
  <text class="a" x="430.0" y="74" text-anchor="middle" opacity="0">— Jean-Paul Sartre
    <animate attributeName="opacity" from="0" to="1" dur="0.8s" begin="cycle.begin+23.6s" fill="freeze"/>
    <animate attributeName="opacity" to="0" dur="0.1s" begin="cycle.begin+21s" fill="freeze"/></text>
</g>
</svg>
